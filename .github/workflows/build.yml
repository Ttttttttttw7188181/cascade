name: Build Cascade APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      # Cascade passes the TUN fd straight to the Xray core, so only the prebuilt
      # AndroidLibXrayLite AAR is needed; no HEV tunnel libraries.
      - name: Fetch prebuilt Xray core (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar
          unzip -l app/libs/libv2ray.aar | grep -q 'jni/arm64-v8a/libgojni.so'

      - name: Run unit tests
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug -PABI_FILTERS='arm64-v8a;armeabi-v7a;x86_64' --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Cascade-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish arm64 test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*arm64-v8a*.apk | head -n1)
          test -n "$apk"
          cp "$apk" Cascade-arm64-v8a-debug.apk
          gh release view ci-arm64 >/dev/null 2>&1 || \
            gh release create ci-arm64 \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "CI arm64 build" \
              --notes "Automated debug build for device testing."
          gh release upload ci-arm64 Cascade-arm64-v8a-debug.apk --clobber
